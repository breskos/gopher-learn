name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: long fuzzing on master
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether Go code changed. Pull requests that only touch
  # documentation skip fuzzing, portability checks and benchmarks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '(\.go|go\.mod|go\.sum|\.github/workflows/.*)$'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      # The race detector slows training down about tenfold, so it checks the
      # fast tests; the quality tests that train real models run without it.
      - name: Race detector (short tests)
        run: go test -race -short $(go list ./... | grep -v /examples/)
      - name: All tests with coverage
        run: go test -coverprofile=coverage.out $(go list ./... | grep -v /examples/)
      - name: Check coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "### Test coverage (Go ${{ matrix.go }}): ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v min=90 'BEGIN { exit !(t < min) }'; then
            echo "::error::Test coverage ${total}% is below 90%"
            exit 1
          fi

  # Every fuzz target runs in its own job, all at the same time: 15 seconds
  # on pull requests and pushes, 3 minutes in the nightly run.
  fuzz:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzReadCSV, pkg: ./learn/ }
          - { name: FuzzReadSVM, pkg: ./learn/ }
          - { name: FuzzReadRecords, pkg: ./model/ }
          - { name: FuzzPredict, pkg: ./model/ }
          - { name: FuzzADWIN, pkg: ./drift/ }
          - { name: FuzzNetwork32Binary, pkg: ./nn/ }
          - { name: FuzzRead, pkg: ./persist/ }
    name: fuzz (${{ matrix.target.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=${{ github.event_name == 'schedule' && '3m' || '15s' }} ${{ matrix.target.pkg }}

  portability:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test on 32-bit
        run: GOARCH=386 go test -short ./nn/ ./drift/ ./learn/ ./encoders/ ./online/ ./model/ ./persist/
      - name: Build for embedded and WebAssembly targets
        run: |
          GOOS=linux GOARCH=arm GOARM=7 go build ./...
          GOOS=linux GOARCH=riscv64 go build ./...
          GOOS=js GOARCH=wasm go build ./...
          GOOS=wasip1 GOARCH=wasm go build ./...

  # Compares the hot paths with the base branch: prediction, training,
  # online learning and drift detection.
  bench:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Compare benchmarks with the base branch
        shell: bash
        run: |
          pkgs="./nn/ ./drift/ ./model/ ./online/"
          bench='^Benchmark(Predict|Predictor|Predictor32|TrainBatch32|FitEpoch|Learn|ADWIN|PageHinkley)$'
          git worktree add ../base "origin/${{ github.base_ref }}"
          (cd ../base && go test -run='^$' -bench="$bench" -benchtime=200ms -count=5 $pkgs > ../base.txt) || true
          go test -run='^$' -bench="$bench" -benchtime=200ms -count=5 $pkgs > ../head.txt
          echo "### Benchmarks against ${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
          go run ./internal/cmd/benchcheck -base ../base.txt -head ../head.txt | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
