name: Feature request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        gopher-learn focuses on tabular data and online learning in pure Go. Please check the [roadmap](https://github.com/breskos/gopher-learn/blob/master/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could gopher-learn solve it? An API sketch helps.
